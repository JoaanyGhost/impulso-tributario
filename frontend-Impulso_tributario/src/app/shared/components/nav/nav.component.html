<nav class="nav" [class.nav--scrolled]="scrolled()" aria-label="Principal">
  <a class="nav__logo" routerLink="/" (click)="closeMenu()">
    <img src="assets/logo/Logo_IT_white.svg" alt="Impulso Tributario Logo" class="nav__logo-image">
    Impulso <br  class="nav__logo-text"/> Tributario
  </a>

  <ul class="nav__links">
    @for (link of links; track link.path) {
      <li>
        <a [routerLink]="link.path" routerLinkActive="is-active">{{ link.label }}</a>
      </li>
    }
  </ul>

  <a class="btn btn-white nav__cta" routerLink="/consulta">Solicitar consulta</a>

  <button
    class="nav__burger"
    type="button"
    [attr.aria-expanded]="menuOpen()"
    aria-controls="mobile-menu"
    (click)="toggleMenu()"
  >
    {{ menuOpen() ? 'Cerrar' : 'Menú' }}
  </button>
</nav>

<div class="menu" id="mobile-menu" [class.menu--open]="menuOpen()" [attr.aria-hidden]="!menuOpen()">
  @for (link of links; track link.path) {
    <a [routerLink]="link.path" (click)="closeMenu()" [tabindex]="menuOpen() ? 0 : -1">{{ link.label }}</a>
  }
  <a class="menu__cta" routerLink="/consulta" (click)="closeMenu()" [tabindex]="menuOpen() ? 0 : -1">
    Solicitar consulta
  </a>
</div>
